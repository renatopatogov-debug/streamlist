<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StremMusic</title>
<script>
/* Layout, tema e desempenho aplicados antes da primeira pintura (evita flash visual) */
(function () {
  try {
    var lay = localStorage.getItem('sm-layout') || 'auto';
    if (lay === 'auto') {
      var w = window.innerWidth, h = window.innerHeight;
      var toque = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      lay = (toque && w < 1500) ? 'compact'
          : (w >= 1680 && h >= 800) ? 'studio'
          : (w >= 1180) ? 'classic' : 'compact';
    }
    if (lay !== 'studio' && lay !== 'compact' && lay !== 'classic') lay = 'classic';
    document.documentElement.dataset.layout = lay;
    if (localStorage.getItem('sm-theme') === 'night') document.documentElement.dataset.theme = 'night';
    if (localStorage.getItem('sm-perf') === 'lite') document.documentElement.dataset.perf = 'lite';
  } catch (e) { document.documentElement.dataset.layout = 'classic'; }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#09090b">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StremMusic">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip-link" href="#scroll">Pular para o conteúdo</a>
<div class="ambient-wash" aria-hidden="true"></div>

<div class="app-container">
  <aside class="sidebar">

      </div>
      <span>StremMusic</span>
    </div>
    <nav aria-label="Navegação principal">
      <button aria-label="Explorar" data-tab="search" class="active">

      <div class="label">Biblioteca</div>

        <span>Biblioteca</span>
      </button>

      <button aria-label="Playlists" data-tab="playlists">

      </button>
      <button aria-label="Favoritas" data-tab="favorites">

        <span>Favoritas</span>
      </button>
      <button aria-label="Histórico" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        <span>Histórico</span>
      </button>
      <button aria-label="Minhas músicas" data-tab="uploads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Minhas</span>
      </button>
      <button aria-label="Downloads" data-tab="downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Downloads</span>
      </button>
      <button aria-label="Offline no aparelho" data-tab="offline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
        <span>No celular</span>
      </button>

      <button aria-label="Configurações" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </aside>

  <div class="main">
    <header>
      <button class="toggle-sidebar" id="btn-toggle-menu" title="Recolher menu" aria-label="Recolher menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <div class="search-wrap" id="search-wrap">
        <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="Buscar músicas, artistas ou link de playlist…" autofocus autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button type="button" id="search-clear" class="search-clear" title="Limpar busca" aria-label="Limpar busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="header-right">
        <button type="button" class="chip" id="net-chip" title="Status da conexão"><span class="dot"></span><span id="net-txt">Online</span></button>
        <a href="/painel" target="_blank" id="btn-host-panel" class="host-btn" title="Painel do Host · Conectar celular e Túnel 4G/5G" aria-label="Painel do Host" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
        </a>
        <button type="button" class="user-chip" id="user-chip" title="Perfil ativo">
          <span class="user-chip-avatar" id="user-chip-avatar">P</span>
          <span id="user-chip-name">Principal</span>
        </button>
        <button id="btn-layout" data-layout="classic" title="Alternar layout (Alt+1..4)" aria-label="Alternar layout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        </button>
      </div>
    </header>

    <div id="scroll" tabindex="-1">
      <div class="mobile-lib-bar" id="mobile-lib-bar">
        <button type="button" class="mlib-pill" data-lib="playlists">Playlists</button>
        <button type="button" class="mlib-pill" data-lib="favorites">Favoritas</button>
        <button type="button" class="mlib-pill" data-lib="history">Histórico</button>
        <button type="button" class="mlib-pill" data-lib="uploads">Minhas</button>
        <button type="button" class="mlib-pill" data-lib="downloads">Downloads</button>
      </div>
      <div id="list"></div>
    </div>
  </div>
</div>

<div class="queue-backdrop" id="queue-backdrop"></div>
<div class="queue-panel" id="queue-panel">
  <div class="queue-header">
    <h3>Fila de Reprodução</h3>
    <div style="display:flex; align-items:center; gap:4px;">
      <button id="btn-smart-q" title="Continuar com faixas sugeridas pelo histórico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      </button>
      <button id="btn-close-queue" aria-label="Fechar fila">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="queue-list" id="queue-list-container"></div>
</div>

<div id="player">
  <div id="fs-bg" aria-hidden="true"></div>
  <button id="player-collapse" title="Esconder player (H)" aria-label="Esconder player">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <div class="now">
    <img id="now-img" alt="">
    <div class="now-info">
      <div id="now-title">Pronto para tocar</div>
      <div id="now-artist">Escolha uma faixa</div>
      <div class="off-chip" id="now-offline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span>Offline</span>
      </div>
    </div>
    <div class="now-actions">
      <button class="pc-btn" id="player-fav" title="Favoritar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </button>
      <button class="pc-btn" id="player-add" title="Adicionar à playlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/></svg>
      </button>
      <button class="pc-btn" id="player-radio" title="Rádio desta música">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/></svg>
      </button>
      <button class="pc-btn" id="player-station" title="Salvar rádio como estação" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
      </button>
    </div>
  </div>

  <div class="center">
    <div class="controls">
      <button class="pc-btn" id="btn-shuffle" title="Aleatório">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      </button>
      <button class="pc-btn" id="btn-prev" title="Anterior (←)">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button class="pc-btn" id="play-btn" title="Play/Pause (Espaço)" disabled>
        <svg id="play-i" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </button>
      <button class="pc-btn" id="btn-next" title="Próxima (→)">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="pc-btn" id="btn-repeat" title="Repetir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
    <div class="progress">
      <span class="time" id="cur-time">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Progresso">
      <span class="time right" id="tot-time">0:00</span>
    </div>
  </div>

  <div class="right-controls">
    <button class="pc-btn btn-lyr" id="btn-lyr" title="Letras (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    </button>
    <button class="pc-btn" id="btn-queue" title="Fila (Q)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <div class="volume">
      <button class="pc-btn" id="mute-btn" title="Mudo (M)">
        <svg id="vol-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
    <button class="pc-btn" id="btn-expand" title="Tela cheia (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    </button>
  </div>

  <!-- Painel lateral integrado no modo tela cheia desktop (Letra / Fila) -->
  <div id="fs-side">
    <div class="fs-side-tabs">
      <button type="button" class="fs-tab on" data-fstab="lyrics">Letra</button>
      <button type="button" class="fs-tab" data-fstab="queue">A seguir</button>
      <button type="button" class="fs-side-close" id="fs-side-close" title="Centralizar player" aria-label="Fechar painel lateral">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="fs-side-body"></div>
  </div>
</div>

<button id="player-restore" title="Mostrar player (H)" aria-label="Mostrar player">
  <svg class="r-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <span class="eq"><span></span><span></span><span></span><span></span></span>
</button>
<button id="btn-top" title="Voltar ao topo" aria-label="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
</button>

<audio id="audio" preload="auto"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Menu de ações da faixa (mobile & overflow) -->
<div class="sheet-ov" id="track-sheet-ov">
  <div class="sheet" id="track-sheet"></div>
</div>

<!-- Modal: adicionar à playlist -->
<div class="modal-ov" id="pl-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Adicionar à Playlist</h3>
      <button id="plm-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="plm-list"></div>
    <div class="plm-new">
      <input id="plm-name" placeholder="Nova playlist…" maxlength="60">
      <button class="btn" id="plm-create">Criar</button>
    </div>
  </div>
</div>

<!-- Modal: editar faixa importada -->
<div class="modal-ov" id="up-modal">
  <div class="modal">
    <div class="modal-head">
      <h3>Editar faixa</h3>
      <button id="upm-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="upm-body">
      <img id="upm-art" alt="" style="width:76px;height:76px;border-radius:10px;object-fit:cover;background:rgba(255,255,255,.06)">
      <div class="upm-fields">
        <input id="upm-title" placeholder="Título" maxlength="200">
        <input id="upm-artist" placeholder="Artista" maxlength="200">
        <input id="upm-album" placeholder="Álbum" maxlength="200">
        <div style="display:flex; gap:8px;">
          <input id="upm-year" placeholder="Ano" maxlength="4" inputmode="numeric" style="width:84px; flex:none;">
          <input id="upm-genre" placeholder="Gênero" maxlength="80">
        </div>
      </div>
    </div>
    <div class="plm-new">
      <input id="upm-search-q" placeholder="Buscar metadados online…" maxlength="200">
      <button class="btn ghost sm" id="upm-search">Buscar</button>
    </div>
    <div id="upm-results"></div>
    <div class="plm-new" style="justify-content:flex-end">
      <button class="btn" id="upm-save">Salvar</button>
    </div>
  </div>
</div>

<!-- Overlay: soltar arquivos pra importar -->
<div id="drop-ov">
  <div class="drop-box">
