# StremMusic em container.
#
#   1) crie um .env ao lado deste arquivo:   APP_TOKEN=uma-senha-longa-sua
#   2) docker compose -f deploy/docker-compose.yml up -d --build
#   3) abra http://127.0.0.1:8787   (a página pede o token)
#
# A porta é publicada só em 127.0.0.1: quem expõe para fora é um proxy
# (Caddy/nginx/Cloudflare Tunnel) — assim o /painel do dono continua local.

services:
  stremmusic:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: stremmusic:local
    container_name: stremmusic
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # OBRIGATÓRIO: sem isto a instância fica aberta para quem achar a URL.
      APP_TOKEN: ${APP_TOKEN:?defina APP_TOKEN no arquivo .env}
      # Atualiza o yt-dlp sozinho: o YouTube quebra versões antigas de tempos em tempos.
      AUTO_UPDATE_YTDLP: "1"
      # Mede os clients no arranque (os "pre-tests") — melhora a 1ª faixa.
      PROBE_ON_BOOT: "1"
    volumes:
      - stremmusic-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/auth/check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  stremmusic-data:
